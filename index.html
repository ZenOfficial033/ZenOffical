<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Spin Wheel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Menggunakan Firebase v8 Compat agar jalan mulus di HTML biasa -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { background: linear-gradient(135deg, #1e3a8a, #3b82f6); font-family: 'Segoe UI', sans-serif; }
        .glass-bubble {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .wheel-box {
            position: relative; border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
            transition: transform 5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 35px solid white; z-index: 10;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-white">

    <div class="glass-bubble w-full max-w-4xl p-4 rounded-full flex justify-between items-center mb-6">
        <h1 class="text-2xl font-black text-white ml-4 drop-shadow-md">BubblySpin</h1>
        <div id="authArea" class="flex gap-4 items-center mr-2">
            <button id="loginBtn" class="bg-white text-blue-600 px-6 py-2 rounded-full font-bold shadow-md hover:scale-105 transition">Login Google</button>
        </div>
    </div>

    <div class="flex flex-col md:flex-row gap-10 items-center justify-center w-full max-w-5xl">
        
        <!-- Papan Hadiah -->
        <div class="glass-bubble p-6 rounded-[2.5rem] w-full md:w-80">
            <h2 class="text-center text-xl font-bold mb-4 drop-shadow-md">Daftar Hadiah</h2>
            <ul id="winrateList" class="space-y-3"></ul>
        </div>

        <!-- Roda Spin -->
        <div class="relative flex flex-col items-center">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="350" height="350" class="wheel-box"></canvas>
            
            <button id="spinBtn" class="mt-8 bg-white text-blue-700 text-2xl font-black px-12 py-4 rounded-full shadow-[0_8px_0_#93c5fd] hover:translate-y-1 hover:shadow-[0_4px_0_#93c5fd] active:translate-y-2 active:shadow-none transition-all hidden">
                SPIN SEKARANG
            </button>
        </div>
    </div>

    <script>
        // Konfigurasi Firebase dari akun Anda
        const firebaseConfig = {
            apiKey: "AIzaSyAWSzeOHIsj1H0cFV_jnfWyWUAsXCouKQE",
            authDomain: "spin-160d8.firebaseapp.com",
            databaseURL: "https://spin-160d8-default-rtdb.firebaseio.com",
            projectId: "spin-160d8",
            storageBucket: "spin-160d8.firebasestorage.app",
            messagingSenderId: "329933102492",
            appId: "1:329933102492:web:8ef4acc2c004bf1dbdbc59",
            measurementId: "G-K40WP55L5B"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let mySpins = 0;
        let totalWeight = 0;

        // Nuansa Biru Modern
        const rewards = [
            { id: 1, name: "Uang 1000", weight: 6, color: "#bfdbfe" }, // blue-200
            { id: 2, name: "Uang 3000", weight: 1, color: "#93c5fd" }, // blue-300
            { id: 3, name: "ZONK", weight: 55, color: "#cbd5e1" },     // gray-300
            { id: 4, name: "Prem Bot 3D", weight: 17, color: "#60a5fa" }, // blue-400
            { id: 5, name: "Prem Bot 5D", weight: 3, color: "#3b82f6" },  // blue-500
            { id: 6, name: "Sewa Bot 3D", weight: 12, color: "#7dd3fc" }, // sky-300
            { id: 7, name: "Sewa Bot 5D", weight: 4, color: "#38bdf8" },  // sky-400
            { id: 8, name: "Scrip Elaina", weight: 0.5, color: "#2563eb" }, // blue-600
            { id: 9, name: "Panel 4GB", weight: 1.5, color: "#1d4ed8" },  // blue-700
        ];
        rewards.forEach(r => totalWeight += r.weight);

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSlices = rewards.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        const halfWidth = canvas.width / 2;

        function drawWheel() {
            for (let i = 0; i < numSlices; i++) {
                ctx.beginPath();
                ctx.moveTo(halfWidth, halfWidth);
                ctx.arc(halfWidth, halfWidth, halfWidth, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.fillStyle = rewards[i].color;
                ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
                
                ctx.save();
                ctx.translate(halfWidth, halfWidth);
                ctx.rotate(i * sliceAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                // Teks putih untuk background gelap, teks hitam untuk background terang
                ctx.fillStyle = (i === 7 || i === 8 || i === 4) ? "#ffffff" : "#1e3a8a"; 
                ctx.font = "bold 14px 'Segoe UI'";
                ctx.fillText(rewards[i].name, halfWidth - 20, 5);
                ctx.restore();
            }
        }
        drawWheel();

        const listContainer = document.getElementById('winrateList');
        rewards.forEach(r => {
            listContainer.innerHTML += `
                <li class="flex justify-between items-center bg-white/10 p-2 rounded-2xl shadow-sm border border-white/20">
                    <div class="flex items-center gap-3">
                        <div class="w-5 h-5 rounded-full border-2 border-white shadow-inner" style="background:${r.color}"></div>
                        <span class="font-bold text-sm text-white drop-shadow-sm">${r.name}</span>
                    </div>
                    <span class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-bold shadow-sm">${r.weight}%</span>
                </li>`;
        });

        document.getElementById('loginBtn').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => alert("Gagal Login: " + err.message));
        });

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                db.ref('users/' + user.uid).once('value', snapshot => {
                    if (!snapshot.exists()) {
                        db.ref('users/' + user.uid).set({ email: user.email, spinCount: 0 });
                    } else {
                        mySpins = snapshot.val().spinCount;
                    }
                    updateUI();
                    
                    db.ref('users/' + user.uid + '/spinCount').on('value', snap => {
                        mySpins = snap.val();
                        updateUI();
                    });
                });
            } else {
                currentUser = null; updateUI();
            }
        });

        function updateUI() {
            const authArea = document.getElementById('authArea');
            const spinBtn = document.getElementById('spinBtn');
            if (currentUser) {
                authArea.innerHTML = `<div class="bg-white/20 px-4 py-2 rounded-full font-bold shadow-inner border border-white/40">🎟️ Spin: <span class="text-xl">${mySpins}</span></div>`;
                spinBtn.style.display = 'block';
            }
        }

        let currentRotation = 0;
        let isSpinning = false;

        document.getElementById('spinBtn').addEventListener('click', () => {
            if (isSpinning) return;
            if (mySpins <= 0) {
                Swal.fire({ icon: 'error', title: 'Spin Habis!', text: 'Minta admin untuk menambah tiket spin Anda.', confirmButtonColor: '#3b82f6' });
                return;
            }

            isSpinning = true;
            db.ref('users/' + currentUser.uid).update({ spinCount: mySpins - 1 });

            let random = Math.random() * totalWeight;
            let selectedIndex = 0;
            for (let i = 0; i < rewards.length; i++) {
                if (random < rewards[i].weight) { selectedIndex = i; break; }
                random -= rewards[i].weight;
            }

            const sliceDeg = 360 / numSlices;
            const targetSliceAngle = 360 - (selectedIndex * sliceDeg) - (sliceDeg / 2);
            currentRotation += 360 * 5; 
            canvas.style.transform = `rotate(${currentRotation + targetSliceAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const hadiah = rewards[selectedIndex].name;
                Swal.fire({
                    title: 'SELAMAT!', text: `Kamu dapat: ${hadiah}`,
                    icon: hadiah === 'ZONK' ? 'error' : 'success',
                    confirmButtonColor: '#3b82f6',
                    backdrop: `rgba(0,0,0,0.6)`
                });
            }, 5000);
        });
    </script>
</body>
</html>
