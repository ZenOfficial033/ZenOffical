<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Spin - Offline Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { 
            background: linear-gradient(135deg, #1e3a8a, #3b82f6); 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden; 
            min-height: 100vh;
        }
        .glass-bubble {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1/1;
            margin: 0 auto;
        }
        .wheel-box {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
            transition: transform 5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .pointer {
            position: absolute; 
            top: -20px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent; 
            border-right: 15px solid transparent; 
            border-top: 40px solid white; 
            z-index: 10;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center p-4 text-white">

    <!-- Header & Auth -->
    <div class="glass-bubble w-full max-w-6xl p-4 rounded-3xl flex justify-between items-center mb-6 mt-2">
        <h1 class="text-xl md:text-2xl font-black text-white ml-2 md:ml-4 drop-shadow-md">BubblySpin</h1>
        <div id="authArea" class="flex gap-2 md:gap-4 items-center mr-2"></div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminArea" class="glass-bubble max-w-4xl w-full p-6 rounded-3xl mb-8 hidden border-2 border-yellow-300/50">
        <h2 class="text-xl font-bold mb-4 text-yellow-300 drop-shadow-md">⚙️ Panel Admin - Kelola Akun & Tiket</h2>
        <div class="flex flex-col md:flex-row gap-3">
            <input type="text" id="targetUser" placeholder="Username" class="flex-1 bg-white/20 text-white placeholder-white/70 px-4 py-3 rounded-full outline-none focus:ring-2 focus:ring-white/50 border border-white/30 text-sm">
            <input type="text" id="targetPass" placeholder="Password (Baru/Ubah)" class="flex-1 bg-white/20 text-white placeholder-white/70 px-4 py-3 rounded-full outline-none focus:ring-2 focus:ring-white/50 border border-white/30 text-sm">
            <input type="number" id="targetAmount" placeholder="Jml Tiket" value="1" class="w-full md:w-32 bg-white/20 text-white placeholder-white/70 px-4 py-3 rounded-full outline-none focus:ring-2 focus:ring-white/50 border border-white/30 text-sm text-center">
            <button onclick="prosesAdmin()" class="bg-yellow-500 hover:bg-yellow-600 text-blue-900 font-bold px-6 py-3 rounded-full transition shadow-md whitespace-nowrap text-sm">Proses</button>
        </div>
        <p class="text-xs text-yellow-200 mt-3">*Jika username belum ada, akun akan otomatis dibuatkan. Default 1 tiket.</p>
    </div>

    <!-- AREA REDEEM CODE -->
    <div id="redeemArea" class="glass-bubble max-w-xl w-full p-4 rounded-3xl flex gap-3 items-center mb-8 hidden">
        <input type="text" id="redeemInput" placeholder="Masukkan Kode Redeem" class="flex-1 bg-white/20 text-white placeholder-white/70 px-6 py-2 rounded-full outline-none focus:ring-2 focus:ring-white/50 border border-white/30 text-sm">
        <button onclick="prosesRedeem()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-full transition shadow-md whitespace-nowrap text-sm">Klaim</button>
    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="flex flex-col lg:flex-row gap-8 items-center lg:items-start justify-center w-full max-w-6xl pb-10">
        
        <!-- Papan Hadiah -->
        <div class="glass-bubble p-5 rounded-3xl w-full max-w-sm lg:w-72 shrink-0 order-2 lg:order-1">
            <h2 class="text-center text-lg font-bold mb-4 drop-shadow-md">Daftar Hadiah & Peluang</h2>
            <ul id="winrateList" class="space-y-2"></ul>
        </div>

        <!-- Roda Spin -->
        <div class="relative flex flex-col items-center flex-1 w-full order-1 lg:order-2">
            <div class="wheel-container">
                <div class="pointer"></div>
                <!-- Canvas resolusi tinggi, dirender via CSS agar tidak pecah & responsif -->
                <canvas id="wheelCanvas" width="500" height="500" class="wheel-box"></canvas>
            </div>
            
            <button id="spinBtn" class="mt-10 bg-white text-blue-700 text-xl md:text-2xl font-black px-10 py-3 md:py-4 rounded-full shadow-[0_6px_0_#93c5fd] hover:translate-y-1 hover:shadow-[0_3px_0_#93c5fd] active:translate-y-2 active:shadow-none transition-all hidden w-4/5 max-w-xs text-center">
                SPIN SEKARANG
            </button>
            <p id="loginHint" class="mt-8 font-semibold bg-black/20 px-6 py-2 rounded-full backdrop-blur-md text-sm md:text-base text-center">Silakan login untuk memutar roda</p>
        </div>

        <!-- Papan Riwayat -->
        <div id="historyArea" class="glass-bubble p-5 rounded-3xl w-full max-w-sm lg:w-72 shrink-0 hidden order-3">
            <h2 class="text-center text-lg font-bold mb-4 drop-shadow-md">Riwayat Hadiahmu</h2>
            <ul id="historyList" class="space-y-2 max-h-60 lg:max-h-80 overflow-y-auto pr-2">
                <!-- Riwayat masuk sini -->
            </ul>
        </div>
    </div>

    <script>
        // --- 1. DATA KODE REDEEM & HADIAH ---
        const validRedeemCodes = ["SPIN01", "SPIN02", "SPIN03", "SPIN04", "SPIN05"];
        
        // TOTAL WEIGHT HARUS 100.
        // H = Hari
        const rewards = [
            { id: 1, name: "Uang 1000", weight: 6, color: "#bfdbfe" },
            { id: 2, name: "Uang 3000", weight: 1, color: "#93c5fd" },
            { id: 3, name: "ZONK", weight: 55, color: "#cbd5e1" }, // Zonk sangat mudah
            { id: 4, name: "Prem Bot 3H", weight: 17, color: "#60a5fa" }, // Prem 3H lumayan mudah
            { id: 5, name: "Prem Bot 5H", weight: 3, color: "#3b82f6" },
            { id: 6, name: "Sewa Bot 3H", weight: 12, color: "#7dd3fc" },
            { id: 7, name: "Sewa Bot 5H", weight: 4, color: "#38bdf8" },
            { id: 8, name: "Scrip Elaina", weight: 0.5, color: "#2563eb" }, // Script sangat susah (0,5%)
            { id: 9, name: "Panel 4GB", weight: 1.5, color: "#1d4ed8" },
        ];
        // Pastikan total exactly 100 untuk pembacaan acak presisi.
        const totalWeight = rewards.reduce((sum, r) => sum + r.weight, 0); 

        // --- 2. SISTEM DATABASE LOCAL & AKUN DEFAULT ---
        if (!localStorage.getItem('bubbly_accounts')) {
            const defaultAccounts = {
                "admin": { pw: "jack123", role: "admin" }
            };
            localStorage.setItem('bubbly_accounts', JSON.stringify(defaultAccounts));
        }

        let accountsDB = JSON.parse(localStorage.getItem('bubbly_accounts'));
        let activeUser = localStorage.getItem('activeUser'); 
        let userData = {}; 
        let isSpinning = false;
        let currentRotation = 0;

        // --- 3. RENDER RODA & WINRATE ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSlices = rewards.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        const halfWidth = canvas.width / 2;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < numSlices; i++) {
                ctx.beginPath();
                ctx.moveTo(halfWidth, halfWidth);
                ctx.arc(halfWidth, halfWidth, halfWidth, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.fillStyle = rewards[i].color;
                ctx.fill();
                ctx.lineWidth = 3; 
                ctx.strokeStyle = "#fff"; 
                ctx.stroke();
                
                ctx.save();
                ctx.translate(halfWidth, halfWidth);
                ctx.rotate(i * sliceAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                // Penyesuaian warna teks agar kontras
                ctx.fillStyle = (i === 7 || i === 8 || i === 4) ? "#ffffff" : "#1e3a8a"; 
                ctx.font = "bold 20px 'Segoe UI'";
                ctx.fillText(rewards[i].name, halfWidth - 30, 7);
                ctx.restore();
            }
        }
        drawWheel();

        const listContainer = document.getElementById('winrateList');
        rewards.forEach(r => {
            listContainer.innerHTML += `
                <li class="flex justify-between items-center bg-white/10 p-2 rounded-2xl shadow-sm border border-white/20">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 md:w-4 md:h-4 rounded-full border-2 border-white shadow-inner" style="background:${r.color}"></div>
                        <span class="font-bold text-xs md:text-sm text-white">${r.name}</span>
                    </div>
                    <span class="bg-blue-600 text-white px-2 py-1 rounded-full text-xs font-bold shadow-sm">${r.weight}%</span>
                </li>`;
        });

        // --- 4. LOGIC LOGIN & SESSION ---
        function loadUserData() {
            if (activeUser) {
                let savedData = localStorage.getItem('data_' + activeUser);
                if (savedData) {
                    userData = JSON.parse(savedData);
                } else {
                    userData = { spinCount: 0, usedCodes: [], history: [] }; 
                    saveUserData();
                }
            }
        }

        function saveUserData() {
            if (activeUser) {
                localStorage.setItem('data_' + activeUser, JSON.stringify(userData));
            }
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            if (userData.history && userData.history.length > 0) {
                [...userData.history].reverse().forEach((item, index) => {
                    historyList.innerHTML += `
                        <li class="bg-white/10 p-2 rounded-xl text-xs md:text-sm font-semibold border border-white/20">
                            ${userData.history.length - index}. ${item}
                        </li>`;
                });
            } else {
                historyList.innerHTML = `<li class="text-white/60 text-sm text-center italic">Belum ada riwayat</li>`;
            }
        }

        function updateUI() {
            const authArea = document.getElementById('authArea');
            const redeemArea = document.getElementById('redeemArea');
            const spinBtn = document.getElementById('spinBtn');
            const loginHint = document.getElementById('loginHint');
            const adminArea = document.getElementById('adminArea');
            const historyArea = document.getElementById('historyArea');

            if (activeUser) {
                const userRole = accountsDB[activeUser].role;
                
                authArea.innerHTML = `
                    <div class="bg-white/20 px-3 md:px-4 py-1.5 md:py-2 rounded-full font-bold shadow-inner border border-white/40 text-xs md:text-sm">
                        👤 ${activeUser} | 🎟️ <span id="spinDisplay">${userData.spinCount || 0}</span>
                    </div>
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 md:px-4 py-1.5 md:py-2 rounded-full font-bold shadow-md transition text-xs md:text-sm">Keluar</button>
                `;
                
                if (userRole === 'admin') {
                    adminArea.classList.remove('hidden');
                    redeemArea.classList.add('hidden');
                    historyArea.classList.add('hidden');
                    spinBtn.style.display = 'none';
                    loginHint.style.display = 'none';
                } else {
                    adminArea.classList.add('hidden');
                    redeemArea.classList.remove('hidden');
                    historyArea.classList.remove('hidden');
                    spinBtn.style.display = 'block';
                    loginHint.style.display = 'none';
                    renderHistory();
                }
            } else {
                authArea.innerHTML = `<button onclick="bukaModalAuth()" class="bg-white text-blue-600 px-6 py-2 rounded-full font-bold shadow-md hover:scale-105 transition text-sm">Masuk Akun</button>`;
                redeemArea.classList.add('hidden');
                adminArea.classList.add('hidden');
                historyArea.classList.add('hidden');
                spinBtn.style.display = 'none';
                loginHint.style.display = 'block';
            }
        }

        async function bukaModalAuth() {
            const { value: formValues } = await Swal.fire({
                title: 'Masuk Ke Akun',
                html: `
                    <input id="swal-user" class="swal2-input" placeholder="Username">
                    <input id="swal-pass" type="password" class="swal2-input" placeholder="Password">
                    <p class="text-xs text-gray-500 mt-2">*Minta akun kepada Admin jika belum punya.</p>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Masuk',
                cancelButtonText: 'Batal',
                background: '#eff6ff',
                confirmButtonColor: '#3b82f6',
                preConfirm: () => {
                    const u = document.getElementById('swal-user').value.toLowerCase().trim();
                    const p = document.getElementById('swal-pass').value;
                    if (!u || !p) { Swal.showValidationMessage('Isi username dan password!'); return false; }
                    return { user: u, pass: p }
                }
            });

            if (formValues) {
                const { user, pass } = formValues;
                if (accountsDB[user]) {
                    if (accountsDB[user].pw === pass) {
                        berhasilLogin(user);
                        Swal.fire({ icon: 'success', title: 'Berhasil!', timer: 1500, showConfirmButton: false });
                    } else {
                        Swal.fire({ icon: 'error', title: 'Gagal', text: 'Password salah!' });
                    }
                } else {
                    Swal.fire({ icon: 'error', title: 'Akun Tidak Ditemukan', text: 'Username ini belum didaftarkan oleh admin.' });
                }
            }
        }

        function berhasilLogin(user) {
            activeUser = user;
            localStorage.setItem('activeUser', activeUser);
            loadUserData();
            updateUI();
        }

        function logout() {
            activeUser = null;
            localStorage.removeItem('activeUser');
            updateUI();
        }

        function prosesRedeem() {
            const input = document.getElementById('redeemInput').value.trim().toUpperCase();
            document.getElementById('redeemInput').value = ''; 

            if (!input) return;
            if (!validRedeemCodes.includes(input)) {
                return Swal.fire({ icon: 'error', title: 'Gagal', text: 'Kode salah atau tidak valid.' });
            }
            if (userData.usedCodes.includes(input)) {
                return Swal.fire({ icon: 'warning', title: 'Gagal', text: 'Kamu sudah menggunakan kode ini!' });
            }

            userData.spinCount += 1;
            userData.usedCodes.push(input);
            saveUserData();
            updateUI();
            Swal.fire({ icon: 'success', title: 'Berhasil!', text: '1 Tiket ditambahkan.' });
        }

        // --- 5. LOGIC ADMIN (Buat Akun & Topup) ---
        function prosesAdmin() {
            const target = document.getElementById('targetUser').value.toLowerCase().trim();
            const pass = document.getElementById('targetPass').value; 
            const amount = parseInt(document.getElementById('targetAmount').value);

            if (!target || isNaN(amount) || amount <= 0) {
                return Swal.fire({ icon: 'error', title: 'Gagal', text: 'Isi form dengan benar.' });
            }

            // Jika User BELUM ADA (Buat Akun Baru)
            if (!accountsDB[target]) {
                if (!pass) {
                    return Swal.fire({ icon: 'error', title: 'Gagal', text: 'Password wajib diisi untuk membuat akun baru!' });
                }
                
                accountsDB[target] = { pw: pass, role: "user" };
                localStorage.setItem('bubbly_accounts', JSON.stringify(accountsDB));
                
                // Set data awal & berikan tiket sesuai input (default 1)
                let newUserData = { spinCount: amount, usedCodes: [], history: [] };
                localStorage.setItem('data_' + target, JSON.stringify(newUserData));
                
                Swal.fire({ icon: 'success', title: 'Akun Dibuat!', text: `Akun ${target} sukses dibuat dengan ${amount} tiket gratis.` });
            } 
            // Jika User SUDAH ADA (Topup / Ganti Password)
            else {
                let existingDataStr = localStorage.getItem('data_' + target);
                let existingData = existingDataStr ? JSON.parse(existingDataStr) : { spinCount: 0, usedCodes: [], history: [] };
                
                existingData.spinCount += amount;
                
                // Ubah password jika form password diisi
                if (pass && pass !== accountsDB[target].pw) {
                    accountsDB[target].pw = pass;
                    localStorage.setItem('bubbly_accounts', JSON.stringify(accountsDB));
                }
                
                localStorage.setItem('data_' + target, JSON.stringify(existingData));
                Swal.fire({ icon: 'success', title: 'Sukses Topup!', text: `${amount} tiket berhasil ditambahkan ke akun ${target}.` });
            }

            document.getElementById('targetUser').value = '';
            document.getElementById('targetPass').value = '';
            document.getElementById('targetAmount').value = '1';
        }

        // --- 6. LOGIC SPIN RODA ---
        document.getElementById('spinBtn').addEventListener('click', () => {
            if (isSpinning) return;
            if (userData.spinCount <= 0) {
                Swal.fire({ icon: 'error', title: 'Tiket Habis!', text: 'Minta Admin untuk menambahkan tiketmu.', confirmButtonColor: '#3b82f6' });
                return;
            }

            isSpinning = true;
            userData.spinCount -= 1;
            saveUserData();
            document.getElementById('spinDisplay').innerText = userData.spinCount;

            // SISTEM GACHA - Murni Berdasarkan Array Weight 100%
            let randomNum = Math.random() * totalWeight; // Math.random menghasilkan angka 0.000... sampai 99.999...
            let selectedIndex = 0;
            for (let i = 0; i < rewards.length; i++) {
                if (randomNum < rewards[i].weight) { 
                    selectedIndex = i; 
                    break; 
                }
                randomNum -= rewards[i].weight;
            }

            // PERHITUNGAN ROTASI UNTUK BERHENTI TEPAT DI PANAH ATAS (270 derajat dari poros canvas standar)
            const sliceDeg = 360 / numSlices;
            // Dapatkan titik tengah dari irisan yang terpilih
            const centerOfSlice = (selectedIndex * sliceDeg) + (sliceDeg / 2);
            // Tambahkan variasi sedikit agar tidak selalu tepat di tengah garis (maks 70% dari batas slice)
            const randomOffset = (Math.random() - 0.5) * (sliceDeg * 0.7); 
            
            // Panah kita berada di posisi "Top" (270 derajat di rotasi standar putaran)
            let targetAngle = 270 - centerOfSlice + randomOffset;
            
            // Konversi sudut menjadi positif murni
            if (targetAngle < 0) targetAngle += 360;

            let baseRotation = currentRotation % 360;
            let addRotation = targetAngle - baseRotation;
            if (addRotation < 0) addRotation += 360;

            // Tambahkan 6 putaran (2160 deg) agar animasi spin terasa lama dan dramatis
            currentRotation += 2160 + addRotation; 
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const hadiah = rewards[selectedIndex].name;
                
                // Tambahkan ke riwayat
                if (!userData.history) userData.history = [];
                userData.history.push(hadiah);
                saveUserData();
                renderHistory();

                Swal.fire({
                    title: hadiah === 'ZONK' ? 'YAHHH...' : 'SELAMAT!', 
                    text: `Kamu mendapatkan: ${hadiah}`,
                    icon: hadiah === 'ZONK' ? 'error' : 'success',
                    confirmButtonColor: '#3b82f6',
                    backdrop: `rgba(0,0,0,0.6)`
                });
            }, 5000);
        });

        // Initialize awal
        loadUserData();
        updateUI();

    </script>
</body>
</html>
