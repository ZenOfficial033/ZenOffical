<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Spin - Offline Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background: linear-gradient(135deg, #1e3a8a, #3b82f6); font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .glass-bubble {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .wheel-box {
            position: relative; border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
            transition: transform 5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 35px solid white; z-index: 10;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 text-white">

    <!-- Header & Auth -->
    <div class="glass-bubble w-full max-w-6xl p-4 rounded-full flex justify-between items-center mb-6 mt-4">
        <h1 class="text-2xl font-black text-white ml-4 drop-shadow-md">BubblySpin</h1>
        <div id="authArea" class="flex gap-4 items-center mr-2"></div>
    </div>

    <!-- ADMIN PANEL (Hanya muncul jika login sebagai admin) -->
    <div id="adminArea" class="glass-bubble max-w-4xl w-full p-6 rounded-[2rem] mb-8 hidden border-2 border-yellow-300/50">
        <h2 class="text-xl font-bold mb-4 text-yellow-300 drop-shadow-md">⚙️ Panel Admin - Kirim Tiket Spin</h2>
        <div class="flex flex-col md:flex-row gap-4">
            <input type="text" id="targetUser" placeholder="Ketik Username Tujuan" class="flex-1 bg-white/20 text-white placeholder-white/70 px-6 py-3 rounded-full outline-none focus:ring-2 focus:ring-white/50 border border-white/30">
            <input type="number" id="targetAmount" placeholder="Jumlah (Misal: 5)" class="w-full md:w-48 bg-white/20 text-white placeholder-white/70 px-6 py-3 rounded-full outline-none focus:ring-2 focus:ring-white/50 border border-white/30">
            <button onclick="kirimTiketAdmin()" class="bg-yellow-500 hover:bg-yellow-600 text-blue-900 font-bold px-8 py-3 rounded-full transition shadow-md whitespace-nowrap">Kirim Tiket</button>
        </div>
    </div>

    <!-- AREA REDEEM CODE -->
    <div id="redeemArea" class="glass-bubble max-w-xl w-full p-4 rounded-full flex gap-3 items-center mb-8 hidden">
        <input type="text" id="redeemInput" placeholder="Masukkan Kode Redeem" class="flex-1 bg-white/20 text-white placeholder-white/70 px-6 py-2 rounded-full outline-none focus:ring-2 focus:ring-white/50 border border-white/30">
        <button onclick="prosesRedeem()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded-full transition shadow-md whitespace-nowrap">Klaim Spin</button>
    </div>

    <div class="flex flex-col md:flex-row gap-8 items-start justify-center w-full max-w-6xl pb-10">
        
        <!-- Papan Hadiah -->
        <div class="glass-bubble p-6 rounded-[2.5rem] w-full md:w-72 shrink-0">
            <h2 class="text-center text-xl font-bold mb-4 drop-shadow-md">Daftar Hadiah</h2>
            <ul id="winrateList" class="space-y-3"></ul>
        </div>

        <!-- Roda Spin -->
        <div class="relative flex flex-col items-center flex-1">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="350" height="350" class="wheel-box"></canvas>
            
            <button id="spinBtn" class="mt-8 bg-white text-blue-700 text-2xl font-black px-12 py-4 rounded-full shadow-[0_8px_0_#93c5fd] hover:translate-y-1 hover:shadow-[0_4px_0_#93c5fd] active:translate-y-2 active:shadow-none transition-all hidden">
                SPIN SEKARANG
            </button>
            <p id="loginHint" class="mt-8 font-semibold bg-black/20 px-6 py-2 rounded-full backdrop-blur-md">Silakan login untuk memutar</p>
        </div>

        <!-- Papan Riwayat -->
        <div id="historyArea" class="glass-bubble p-6 rounded-[2.5rem] w-full md:w-72 shrink-0 hidden">
            <h2 class="text-center text-xl font-bold mb-4 drop-shadow-md">Riwayatmu</h2>
            <ul id="historyList" class="space-y-2 max-h-80 overflow-y-auto pr-2">
                <!-- Riwayat masuk sini -->
            </ul>
        </div>
    </div>

    <script>
        // --- 1. DATA KODE REDEEM & HADIAH ---
        const validRedeemCodes = ["SPIN01", "SPIN02", "SPIN03", "SPIN04", "SPIN05", "SPIN06", "SPIN07", "SPIN08", "SPIN09", "SPIN10"];
        
        const rewards = [
            { id: 1, name: "Uang 1000", weight: 6, color: "#bfdbfe" },
            { id: 2, name: "Uang 3000", weight: 1, color: "#93c5fd" },
            { id: 3, name: "ZONK", weight: 55, color: "#cbd5e1" },
            { id: 4, name: "Prem Bot 3D", weight: 17, color: "#60a5fa" },
            { id: 5, name: "Prem Bot 5D", weight: 3, color: "#3b82f6" },
            { id: 6, name: "Sewa Bot 3D", weight: 12, color: "#7dd3fc" },
            { id: 7, name: "Sewa Bot 5D", weight: 4, color: "#38bdf8" },
            { id: 8, name: "Scrip Elaina", weight: 0.5, color: "#2563eb" },
            { id: 9, name: "Panel 4GB", weight: 1.5, color: "#1d4ed8" },
        ];
        const totalWeight = rewards.reduce((sum, r) => sum + r.weight, 0);

        // --- 2. SISTEM DATABASE LOCAL & AKUN DEFAULT ---
        // Setup akun awal jika belum ada di komputer
        if (!localStorage.getItem('bubbly_accounts')) {
            const defaultAccounts = {
                "admin": { pw: "admin123", role: "admin" },
                "budi": { pw: "sandi123", role: "user" },
                "siti": { pw: "sandi123", role: "user" }
            };
            localStorage.setItem('bubbly_accounts', JSON.stringify(defaultAccounts));
        }

        let accountsDB = JSON.parse(localStorage.getItem('bubbly_accounts'));
        let activeUser = localStorage.getItem('activeUser'); 
        let userData = {}; 
        let isSpinning = false;
        let currentRotation = 0;

        // --- 3. RENDER RODA & WINRATE ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSlices = rewards.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        const halfWidth = canvas.width / 2;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < numSlices; i++) {
                ctx.beginPath();
                ctx.moveTo(halfWidth, halfWidth);
                ctx.arc(halfWidth, halfWidth, halfWidth, i * sliceAngle, (i + 1) * sliceAngle);
                ctx.fillStyle = rewards[i].color;
                ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
                
                ctx.save();
                ctx.translate(halfWidth, halfWidth);
                ctx.rotate(i * sliceAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = (i === 7 || i === 8 || i === 4) ? "#ffffff" : "#1e3a8a"; 
                ctx.font = "bold 14px 'Segoe UI'";
                ctx.fillText(rewards[i].name, halfWidth - 20, 5);
                ctx.restore();
            }
        }
        drawWheel();

        const listContainer = document.getElementById('winrateList');
        rewards.forEach(r => {
            listContainer.innerHTML += `
                <li class="flex justify-between items-center bg-white/10 p-2 rounded-2xl shadow-sm border border-white/20">
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 rounded-full border-2 border-white shadow-inner" style="background:${r.color}"></div>
                        <span class="font-bold text-xs text-white">${r.name}</span>
                    </div>
                    <span class="bg-blue-600 text-white px-2 py-1 rounded-full text-xs font-bold shadow-sm">${r.weight}%</span>
                </li>`;
        });

        // --- 4. LOGIC LOGIN & DAFTAR ---
        function loadUserData() {
            if (activeUser) {
                let savedData = localStorage.getItem('data_' + activeUser);
                if (savedData) {
                    userData = JSON.parse(savedData);
                } else {
                    // USER BARU: Otomatis dapat 1 Tiket Gratis
                    userData = { spinCount: 1, usedCodes: [], history: [] }; 
                    saveUserData();
                }
            }
        }

        function saveUserData() {
            if (activeUser) {
                localStorage.setItem('data_' + activeUser, JSON.stringify(userData));
            }
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            if (userData.history && userData.history.length > 0) {
                // Tampilkan dari yang paling baru
                [...userData.history].reverse().forEach((item, index) => {
                    historyList.innerHTML += `
                        <li class="bg-white/10 p-2 rounded-xl text-sm font-semibold border border-white/20">
                            ${userData.history.length - index}. ${item}
                        </li>`;
                });
            } else {
                historyList.innerHTML = `<li class="text-white/60 text-sm text-center italic">Belum ada riwayat</li>`;
            }
        }

        function updateUI() {
            const authArea = document.getElementById('authArea');
            const redeemArea = document.getElementById('redeemArea');
            const spinBtn = document.getElementById('spinBtn');
            const loginHint = document.getElementById('loginHint');
            const adminArea = document.getElementById('adminArea');
            const historyArea = document.getElementById('historyArea');

            if (activeUser) {
                const userRole = accountsDB[activeUser].role;
                
                authArea.innerHTML = `
                    <div class="bg-white/20 px-4 py-2 rounded-full font-bold shadow-inner border border-white/40 text-sm md:text-base">
                        👤 ${activeUser} | 🎟️ <span id="spinDisplay">${userData.spinCount}</span>
                    </div>
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full font-bold shadow-md transition">Keluar</button>
                `;
                
                if (userRole === 'admin') {
                    adminArea.classList.remove('hidden');
                    redeemArea.classList.add('hidden');
                    historyArea.classList.add('hidden');
                    spinBtn.style.display = 'none';
                    loginHint.style.display = 'none';
                } else {
                    adminArea.classList.add('hidden');
                    redeemArea.classList.remove('hidden');
                    historyArea.classList.remove('hidden');
                    spinBtn.style.display = 'block';
                    loginHint.style.display = 'none';
                    renderHistory();
                }
            } else {
                authArea.innerHTML = `<button onclick="bukaModalAuth()" class="bg-white text-blue-600 px-8 py-2 rounded-full font-bold shadow-md hover:scale-105 transition">Login / Daftar</button>`;
                redeemArea.classList.add('hidden');
                adminArea.classList.add('hidden');
                historyArea.classList.add('hidden');
                spinBtn.style.display = 'none';
                loginHint.style.display = 'block';
            }
        }

        async function bukaModalAuth() {
            const { value: formValues } = await Swal.fire({
                title: 'Masuk / Daftar',
                html: `
                    <input id="swal-user" class="swal2-input" placeholder="Username (tanpa spasi)">
                    <input id="swal-pass" type="password" class="swal2-input" placeholder="Password">
                    <p class="text-sm text-gray-500 mt-2">Jika belum daftar, akun akan otomatis dibuat.</p>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Masuk / Daftar',
                cancelButtonText: 'Batal',
                background: '#eff6ff',
                confirmButtonColor: '#3b82f6',
                preConfirm: () => {
                    const u = document.getElementById('swal-user').value.toLowerCase().trim();
                    const p = document.getElementById('swal-pass').value;
                    if (!u || !p) { Swal.showValidationMessage('Isi username dan password!'); return false; }
                    return { user: u, pass: p }
                }
            });

            if (formValues) {
                const { user, pass } = formValues;
                
                // Cek apakah akun sudah ada
                if (accountsDB[user]) {
                    if (accountsDB[user].pw === pass) {
                        berhasilLogin(user);
                    } else {
                        Swal.fire({ icon: 'error', title: 'Gagal', text: 'Password salah!' });
                    }
                } else {
                    // DAFTAR AKUN BARU
                    accountsDB[user] = { pw: pass, role: "user" };
                    localStorage.setItem('bubbly_accounts', JSON.stringify(accountsDB));
                    
                    Swal.fire({ icon: 'success', title: 'Akun Dibuat!', text: 'Selamat datang! Kamu dapat 1 Tiket Gratis.', timer: 2500, showConfirmButton: false });
                    berhasilLogin(user);
                }
            }
        }

        function berhasilLogin(user) {
            activeUser = user;
            localStorage.setItem('activeUser', activeUser);
            loadUserData();
            updateUI();
        }

        function logout() {
            activeUser = null;
            localStorage.removeItem('activeUser');
            updateUI();
        }

        // --- 5. LOGIC REDEEM CODE ---
        function prosesRedeem() {
            const input = document.getElementById('redeemInput').value.trim().toUpperCase();
            document.getElementById('redeemInput').value = ''; 

            if (!input) return;
            if (!validRedeemCodes.includes(input)) {
                Swal.fire({ icon: 'error', title: 'Kode Tidak Valid', text: 'Kode salah atau tidak ada.' });
                return;
            }
            if (userData.usedCodes.includes(input)) {
                Swal.fire({ icon: 'warning', title: 'Sudah Diklaim', text: 'Kamu tidak bisa menggunakan kode yang sama dua kali!' });
                return;
            }

            userData.spinCount += 1;
            userData.usedCodes.push(input); // Tandai kode telah terpakai untuk akun ini
            saveUserData();
            updateUI();
            Swal.fire({ icon: 'success', title: 'Berhasil!', text: '1 Tiket ditambahkan ke akunmu.' });
        }

        // --- 6. LOGIC ADMIN (Kirim Tiket) ---
        function kirimTiketAdmin() {
            const target = document.getElementById('targetUser').value.toLowerCase().trim();
            const amount = parseInt(document.getElementById('targetAmount').value);

            if (!target || isNaN(amount) || amount <= 0) {
                Swal.fire({ icon: 'error', title: 'Gagal', text: 'Isi username dan jumlah dengan benar.' });
                return;
            }
            if (!accountsDB[target]) {
                Swal.fire({ icon: 'error', title: 'Tidak Ditemukan', text: 'Username tersebut belum pernah daftar/login.' });
                return;
            }

            // Tarik data target
            let targetDataString = localStorage.getItem('data_' + target);
            let targetData = targetDataString ? JSON.parse(targetDataString) : { spinCount: 0, usedCodes: [], history: [] };
            
            targetData.spinCount += amount;
            localStorage.setItem('data_' + target, JSON.stringify(targetData));

            document.getElementById('targetUser').value = '';
            document.getElementById('targetAmount').value = '';
            Swal.fire({ icon: 'success', title: 'Terkirim!', text: `${amount} tiket berhasil dikirim ke ${target}.` });
        }

        // --- 7. LOGIC SPIN RODA ---
        document.getElementById('spinBtn').addEventListener('click', () => {
            if (isSpinning) return;
            if (userData.spinCount <= 0) {
                Swal.fire({ icon: 'error', title: 'Spin Habis!', text: 'Gunakan kode redeem atau minta admin.', confirmButtonColor: '#3b82f6' });
                return;
            }

            isSpinning = true;
            userData.spinCount -= 1;
            saveUserData();
            document.getElementById('spinDisplay').innerText = userData.spinCount;

            let random = Math.random() * totalWeight;
            let selectedIndex = 0;
            for (let i = 0; i < rewards.length; i++) {
                if (random < rewards[i].weight) { selectedIndex = i; break; }
                random -= rewards[i].weight;
            }

            const sliceDeg = 360 / numSlices;
            const targetSliceAngle = 360 - (selectedIndex * sliceDeg) - (sliceDeg / 2);
            currentRotation += 360 * 5; 
            canvas.style.transform = `rotate(${currentRotation + targetSliceAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const hadiah = rewards[selectedIndex].name;
                
                // Tambahkan ke riwayat
                if (!userData.history) userData.history = [];
                userData.history.push(hadiah);
                saveUserData();
                renderHistory(); // Update tampilan riwayat

                Swal.fire({
                    title: 'SELAMAT!', text: `Kamu dapat: ${hadiah}`,
                    icon: hadiah === 'ZONK' ? 'error' : 'success',
                    confirmButtonColor: '#3b82f6',
                    backdrop: `rgba(0,0,0,0.6)`
                });
            }, 5000);
        });

        // Initialize awal
        loadUserData();
        updateUI();

    </script>
</body>
</html>
