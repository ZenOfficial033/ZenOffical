<!DOCTYPE html>
<html lang="id">
<head>
    <title>Admin - BubblySpin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-blue-50 p-8 font-sans text-gray-800">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-blue-100 flex items-center justify-between">
            <h1 class="text-3xl font-black text-blue-700">⚙️ Admin Dashboard</h1>
            <span class="bg-blue-100 text-blue-800 px-4 py-1 rounded-full font-bold text-sm">Realtime System</span>
        </div>

        <!-- Form Kirim Spin Manual via Ketik Email -->
        <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-blue-100">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Beri Spin via Pencarian Email</h2>
            <div class="flex gap-4">
                <input type="email" id="searchEmail" placeholder="Ketik email user (misal: user@gmail.com)" class="flex-1 p-4 bg-gray-50 border border-gray-200 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="number" id="spinAmount" placeholder="Jumlah (contoh: 5)" class="w-40 p-4 bg-gray-50 border border-gray-200 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="kirimSpinManual()" class="bg-blue-600 text-white px-8 py-4 rounded-full font-bold shadow-md hover:bg-blue-700 transition">Kirim Tiket</button>
            </div>
        </div>

        <!-- Daftar Semua User -->
        <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-blue-100">
            <h2 class="text-xl font-bold mb-4 text-gray-700">Daftar Semua Pemain</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-blue-100 text-blue-800">
                            <th class="p-4 rounded-tl-2xl">Email Akun</th>
                            <th class="p-4">Sisa Spin</th>
                            <th class="p-4 rounded-tr-2xl text-center">Aksi Cepat</th>
                        </tr>
                    </thead>
                    <tbody id="userTable">
                        <!-- Data masuk otomatis -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Konfigurasi Firebase dari akun Anda
        const firebaseConfig = {
            apiKey: "AIzaSyAWSzeOHIsj1H0cFV_jnfWyWUAsXCouKQE",
            authDomain: "spin-160d8.firebaseapp.com",
            databaseURL: "https://spin-160d8-default-rtdb.firebaseio.com",
            projectId: "spin-160d8",
            storageBucket: "spin-160d8.firebasestorage.app",
            messagingSenderId: "329933102492",
            appId: "1:329933102492:web:8ef4acc2c004bf1dbdbc59",
            measurementId: "G-K40WP55L5B"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allUsers = {};

        // Render tabel otomatis
        db.ref('users').on('value', snapshot => {
            const table = document.getElementById('userTable');
            table.innerHTML = ''; 
            allUsers = {}; // Simpan di memori untuk pencarian manual
            
            snapshot.forEach(childSnapshot => {
                const uid = childSnapshot.key;
                const data = childSnapshot.val();
                allUsers[data.email] = { uid: uid, spinCount: data.spinCount };
                
                table.innerHTML += `
                    <tr class="border-b border-gray-100 hover:bg-blue-50/50">
                        <td class="p-4 font-medium text-gray-700">${data.email}</td>
                        <td class="p-4 font-black text-2xl text-blue-600">${data.spinCount}</td>
                        <td class="p-4 text-center">
                            <button onclick="tambahSpinSatu('${uid}', ${data.spinCount})" class="bg-green-500 text-white px-6 py-2 rounded-full font-bold shadow hover:bg-green-600 transition">+1 Spin</button>
                        </td>
                    </tr>
                `;
            });
        });

        // Tombol Aksi Cepat
        function tambahSpinSatu(uid, currentSpin) {
            db.ref('users/' + uid).update({ spinCount: currentSpin + 1 });
            const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
            Toast.fire({ icon: 'success', title: '1 Spin berhasil ditambahkan!' });
        }

        // Fitur Ketik Email
        function kirimSpinManual() {
            const emailInput = document.getElementById('searchEmail').value.trim();
            const amountInput = parseInt(document.getElementById('spinAmount').value);

            if (!emailInput || isNaN(amountInput)) {
                Swal.fire({ icon: 'error', title: 'Isi lengkap', text: 'Masukkan email dan jumlah spin!' });
                return;
            }

            const userData = allUsers[emailInput];
            if (!userData) {
                Swal.fire({ icon: 'error', title: 'User tidak ditemukan', text: 'Email tersebut belum pernah login ke website.' });
                return;
            }

            const newTotal = userData.spinCount + amountInput;
            db.ref('users/' + userData.uid).update({ spinCount: newTotal });
            
            document.getElementById('searchEmail').value = '';
            document.getElementById('spinAmount').value = '';
            
            Swal.fire({ icon: 'success', title: 'Berhasil!', text: `${amountInput} spin dikirim ke ${emailInput}` });
        }
    </script>
</body>
</html>
